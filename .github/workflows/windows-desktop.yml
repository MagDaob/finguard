name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'scripts/build-windows.py'
      - 'scripts/prepare-release.py'
      - '.github/workflows/windows-desktop.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'LICENSE'
      - 'NOTICE'
      - 'src/**'
      - 'frontend/**'
      - 'packages/**'
      - 'services/bank-simulator/**'
      - 'docs/releases/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build isolated Windows executables
        run: uv run --locked python scripts/build-windows.py
      - name: Prepare versioned release attachments and verify actual EXE
        run: uv run --locked python scripts/prepare-release.py --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FinGuard-windows-x64
          path: dist/releases/*/windows-x64/*
          if-no-files-found: error
          retention-days: 14
