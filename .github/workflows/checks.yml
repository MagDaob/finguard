name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv run --locked --no-sync pytest -q
      - run: uv run --locked --no-sync finguard validate-scenario --config configs/development.example.toml
      - run: uv build --no-sources
