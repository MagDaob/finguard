name: Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv run --locked --no-sync pytest -q -m "not postgres"
      - run: uv run --locked --no-sync finguard validate-scenario --config configs/development.example.toml
      - run: uv build --all --no-sources
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: finguard
          POSTGRES_DB: finguard
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finguard -d finguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINGUARD_DATABASE_URL: postgresql://finguard@127.0.0.1:5432/finguard
      FINGUARD_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --locked --no-sync pytest -q -m postgres
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t finguard:check .
      - run: docker run --rm finguard:check uv run --locked --no-sync finguard --help
      - run: docker run --rm finguard:check /app/.venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('finguard_simulator') is None"
      - run: docker build -f services/bank-simulator/Dockerfile -t finguard-simulator:check .
      - run: docker run --rm finguard-simulator:check /app/.venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('finguard') is None"
      - run: docker build -f frontend/Dockerfile -t finguard-frontend:check .
      - name: Run Compose backend and database
        run: |
          export FINGUARD_POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export SIMBANK_POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export FINGUARD_BANK_API_KEY="$(openssl rand -hex 32)"
          trap 'docker compose logs --tail 100; docker compose down' EXIT
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T bank-simulator /app/.venv/bin/finguard-bank-simulator seed-demo
          docker compose exec -T backend uv run --locked --no-sync finguard seed-demo
          docker compose exec -T backend uv run --locked --no-sync finguard worker --once
          docker compose exec -T frontend wget -q -O /dev/null http://127.0.0.1/tasks
          docker compose exec -T frontend wget -q -O - http://127.0.0.1/health/ready
