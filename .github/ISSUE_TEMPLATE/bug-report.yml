name: 软件问题
description: 报告可复现的软件问题
body:
  - type: markdown
    attributes:
      value: 请提供不含敏感信息的复现步骤。不要上传 API key、访问令牌、完整用户数据目录或未脱敏的日志。
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 0.3.0；便携版可查看主程序属性
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 使用方式
      options:
        - Windows 便携版
        - 从源码启动
        - 容器部署
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统
      placeholder: 系统版本与架构；请勿填写用户名或设备标识
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 脱敏后的错误信息
      description: 可附错误码或必要截图，先移除凭据和业务数据。
