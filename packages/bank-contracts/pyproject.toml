[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "finguard-bank-contracts"
version = "0.3.0"
description = "Shared bank wire contracts without application or simulator dependencies"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.12,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/finguard_bank_contracts"]
