[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "finguard"
version = "0.3.0"
description = "FinGuard simulated financial task backend with authorization and recovery"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "finguard-bank-contracts==0.3.0",
    "finguard-plugin-contracts==0.3.0",
    "fastapi>=0.120,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "uvicorn>=0.38,<1",
]

[project.scripts]
finguard = "finguard.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "finguard-bank-simulator==0.3.0"]

[tool.uv.workspace]
members = ["packages/bank-contracts", "packages/plugin-contracts", "services/bank-simulator"]

[tool.uv.sources]
finguard-bank-contracts = { workspace = true }
finguard-plugin-contracts = { workspace = true }
finguard-bank-simulator = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/finguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = ["postgres: requires a disposable PostgreSQL schema"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
