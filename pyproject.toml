[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "finguard"
version = "0.1.0"
description = "FinGuard financial task domain and tool contracts"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
finguard = "finguard.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/finguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
